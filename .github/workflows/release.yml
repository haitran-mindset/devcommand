name: Release macOS

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - id: version
        run: node scripts/check-release.mjs

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.validate.outputs.version }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Isolate shell and agent environment
        run: |
          mkdir -p "$RUNNER_TEMP/devcommand-zsh"
          echo "ZDOTDIR=$RUNNER_TEMP/devcommand-zsh" >> "$GITHUB_ENV"
          echo "SSH_AUTH_SOCK=$RUNNER_TEMP/devcommand-unused-agent.sock" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:release
      - run: npm test
      - name: Build installer
        run: npm run dist -- --mac --"$ARCH" --publish never
      - name: Verify and prepare download
        run: |
          hdiutil verify "release/DevCommand-$VERSION-$ARCH.dmg"
          mkdir -p release-assets
          cp "release/DevCommand-$VERSION-$ARCH.dmg" "release-assets/DevCommand-mac-$ARCH.dmg"
          cd release-assets
          shasum -a 256 "DevCommand-mac-$ARCH.dmg" > "SHA256SUMS-$ARCH.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: mac-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: mac-*
          merge-multiple: true
          path: release-assets
      - name: Check installers
        working-directory: release-assets
        run: |
          test -s DevCommand-mac-arm64.dmg
          test -s DevCommand-mac-x64.dmg
          cat SHA256SUMS-arm64.txt SHA256SUMS-x64.txt > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish complete release
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"; then
            test "$(jq -r .draft "$RUNNER_TEMP/release.json")" = true || {
              echo 'Refusing to overwrite a published release.' >&2
              exit 1
            }
          else
            cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          Download **DevCommand-mac-arm64.dmg** for Apple Silicon or **DevCommand-mac-x64.dmg** for Intel.
          Open the DMG and drag DevCommand into Applications.

          These builds are unsigned and not notarized. If macOS blocks opening, review the app in System Settings → Privacy & Security.
          Verify downloads with `shasum -a 256 -c SHA256SUMS.txt` after downloading both installers and the checksum file.
          NOTES
            args=()
            if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
            gh release create "$TAG" --verify-tag --draft --title "DevCommand $TAG" \
              --generate-notes --notes-file "$RUNNER_TEMP/notes.md" "${args[@]}"
            gh api "repos/$GH_REPO/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"
          fi
          gh release upload "$TAG" release-assets/DevCommand-mac-arm64.dmg \
            release-assets/DevCommand-mac-x64.dmg release-assets/SHA256SUMS.txt --clobber
          release_id=$(jq -r .id "$RUNNER_TEMP/release.json")
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
            -F draft=false -F prerelease="$PRERELEASE" -f make_latest=legacy
          echo "Release: https://github.com/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
